<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pokédex</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/icon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    {% include "components/header.html" %}

  <main style="padding-top: 90px;">
    {% block content %}{% endblock %}
  </main>

    <footer class="pokedex-footer">
      <svg
        class="barra-shape"
        viewBox="0 0 1364 68"
        preserveAspectRatio="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <linearGradient id="barraGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#A92F2F" />

            <stop offset="50%" stop-color="#7A2020" />

            <stop offset="100%" stop-color="#4A1111" />
          </linearGradient>
        </defs>

        <path
          d="M0 10H313L346.5 45H658V32C658 19.2975 668.298 9 681 9C693.702 9 704 19.2975 704 32V45H1029.5L1063 10H1364V68H0V10Z"
          fill="url(#barraGradient)"
          stroke="#3F424A"
          stroke-width="7"
        />

        <path
          d="M0 10H313L346.5 45H658V32C658 19.2975 668.298 9 681 9C693.702 9 704 19.2975 704 32V45H1029.5L1063 10H1364V68H0V10Z"
          fill="url(#barraGradient)"
          stroke="#161616"
          stroke-width="3"
        />
      </svg>

      <div class="pokebola-wrapper">
        <img
            src="{{ url_for('static', filename='images/comum/pokebola.png') }}"
            alt="Pokébola Central"
            class="pokebola-btn"
            id="pokebola-btn"
        />
        <div class="encounter-tooltip">
          <span class="tooltip-arrow"></span>
          Encontro Selvagem
        </div>
      </div>
    </footer>

    <section class="minigame-panel" id="minigame-panel" aria-hidden="true">
      <div class="minigame-bg"></div>
      <div class="minigame-overlay"></div>

      <div class="minigame-content">
        <div class="minigame-head">
          <h2>Encontro Selvagem</h2>
          <button type="button" class="minigame-close" id="minigame-close" aria-label="Fechar">&times;</button>
        </div>

        <div class="minigame-body">
          <div class="minigame-stage" id="minigame-stage">
            <button type="button" class="reroll-btn" id="reroll-btn" aria-label="Reroll">↻</button>
            <div class="stage-glow"></div>
            <img draggable="false" id="mystery-sprite" class="mystery-sprite silhouette" src="" alt="Pokémon misterioso" />
            <p class="stage-hint" id="stage-hint">Quem é esse Pokémon?</p>
          </div>

          <div class="minigame-guess" id="minigame-guess">
            <form id="guess-form" class="guess-form" autocomplete="off">
              <input
                type="text"
                id="guess-input"
                class="guess-input"
                placeholder="Digite o nome do Pokémon..."
                autocomplete="off"
                disabled
              />
              <button type="submit" class="guess-submit" id="guess-submit" disabled>Adivinhar</button>
            </form>
            <p class="guess-feedback" id="guess-feedback"></p>
            <p class="guess-tries" id="guess-tries"></p>

            <button type="button" class="hint-btn" id="hint-btn">Dica (3)</button>
            <p class="hints-display" id="hints-display"></p>
          </div>
        </div>
      </div>
    </section>
  </body>

  <script src="{{ url_for('static', filename='scripts/pesquisar.js') }}"></script>
  <script src="{{ url_for('static', filename='scripts/minigame.js') }}"></script>
</html>
